<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tünetnapló</title>
<style>
  body { font: 15px system-ui, sans-serif; background: #fff; color: #222; max-width: 560px; margin: auto; padding: 16px; }
  .chk { display: inline-block; padding: 8px 12px; border: 1px solid #767676; border-radius: 16px; margin: 4px; cursor: pointer; }
  .chk.on { background: #0e7c66; color: #fff; }
  input, textarea { display: block; width: 100%; padding: 8px; font: inherit; border: 1px solid #767676; }
  .hibas { border: 2px solid #e74c3c; }
  .btn { display: inline-block; margin-top: 12px; background: #0e7c66; color: #fff; padding: 10px 16px; cursor: pointer; }
  #ok { color: #2ecc71; font-weight: bold; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  .chk-label { display: inline-block; cursor: pointer; }

  input[type="checkbox"]:checked + .chk {
    background: #0e7c66;
    color: #fff;
  }
  input[type="checkbox"]:focus-visible + .chk {
    outline: 3px solid #000;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<h1>Napi tünetnapló</h1>
<h2>Tünetek</h2>
<fieldset id="tunetek" style="border: none; padding: 0; margin: 0;">
  <legend class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Válaszd ki a tüneteket</legend>
  
  <label class="chk-label">
    <input type="checkbox" name="tunet" value="fejfajas" class="sr-only">
    <span class="chk">Fejfájás</span>
  </label>

  <label class="chk-label">
    <input type="checkbox" name="tunet" value="hanyinger" class="sr-only">
    <span class="chk">Hányinger</span>
  </label>

  <label class="chk-label">
    <input type="checkbox" name="tunet" value="szedules" class="sr-only">
    <span class="chk">Szédülés</span>
  </label>
</fieldset>
<h2><label for="eros">Erősség (0–10)</label></h2>
<input id="eros" type="number" min="0" max="10" tabindex="2">
<h2><label for="megj">Megjegyzés</label></h2>
<textarea id="megj" tabindex="1"></textarea>
<div class="btn" id="ment">Mentés</div>
<p id="ok"></p>
<script>
  document.getElementById('ment').addEventListener('click', function () {
    var eros = document.getElementById('eros');
    var v = Number(eros.value);
    document.getElementById('ok').textContent = '';
    if (eros.value === '' || v < 0 || v > 10) { eros.classList.add('hibas'); return; }
    eros.classList.remove('hibas');
    document.getElementById('ok').textContent = 'Mentve!';
  });
</script>
</body>
</html>
